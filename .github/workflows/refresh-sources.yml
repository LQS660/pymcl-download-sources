name: Refresh download sources

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe candidate URLs
        shell: python
        run: |
          from pathlib import Path
          import urllib.error
          import urllib.request

          defaults = (
              "https://ghfast.top/",
              "https://gh.llkk.cc/",
              "https://ghproxy.vip/",
              "https://gh-proxy.com/",
              "https://v6.gh-proxy.org/",
              "https://cdn.gh-proxy.com/",
              "https://bmclapi2.bangbang93.com",
              "https://mod.mcimirror.top",
          )
          current = Path("sources.txt").read_text(encoding="utf-8").splitlines()
          candidates = tuple(dict.fromkeys((*current, *defaults)))

          def responds_ok(url):
              for method in ("HEAD", "GET"):
                  headers = {"User-Agent": "PyMCL-source-refresh/1.0"}
                  if method == "GET":
                      headers["Range"] = "bytes=0-0"
                  request = urllib.request.Request(url, method=method, headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=8) as response:
                          if response.status < 400:
                              return True
                  except (OSError, urllib.error.URLError):
                      pass
              return False

          alive = [url for url in candidates if url.startswith("https://") and responds_ok(url)]
          Path("sources.txt").write_text("\n".join(alive or defaults) + "\n", encoding="utf-8")
      - name: Commit refreshed list
        run: |
          if git diff --quiet -- sources.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.txt
          git commit -m "chore: refresh download sources"
          git push
